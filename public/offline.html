<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | Zelthia</title>
    <style>
      :root { --paper: #f6f9f7; --ink: #0e2a2b; --muted: #566b67; --brand: #0d7f57; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #0b1617; --ink: #e4eeeb; --muted: #93a9a4; --brand: #3cc792; }
      }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
      a { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Zelthia" />
      <h1>You're offline</h1>
      <p>Zelthia needs a connection to check stock and answer questions. In an emergency, call <a href="tel:112">112</a>.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
